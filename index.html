<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="theme-color" content="#1a1c8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <title>ThaID Full Feature</title>
  
  <!-- 🌟 1. เปลี่ยนฟอนต์เป็น Prompt จาก Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ไอคอน FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      margin: 0;
      background: #1a1c8f;
      overflow: hidden;
    }

    body {
      /* 🌟 2. ใช้ฟอนต์ Prompt */
      font-family: 'Prompt', sans-serif;
      width: 100%;
    }

    /* 🌟 กรอบหลักของแอป */
    .app-container {
      position: fixed;
      top: 0; left: 0; right: 0;
      bottom: 0;
      height: auto;          
      max-height: none;
      max-width: none;
      width: auto;
      border: none;
      border-radius: 0;
      background: #1a1c8f;
      display: flex;
      flex-direction: column;
      box-shadow: none;
      overflow: hidden;
    }

    input[type="file"] { display: none; }

    /* 🌟 ส่วนหัว */
    header {
      color: white;
      background: #1a1c8f;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
      padding: calc(env(safe-area-inset-top) + 12px) 20px 20px 20px;
      isolation: isolate;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 12px; }

    .avatar-container { position: relative; cursor: pointer; border-radius: 50%; }
    .avatar-container:active { transform: scale(0.95); }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%; background-color: #ccc;
      background-size: cover; background-position: center; border: 2px solid rgba(255,255,255,0.3);
      background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80');
    }

    /* 🌟 3. ปรับขนาดตัวอักษรให้ใหญ่ขึ้น */
    .user-text p { font-size: 13px; color: #d1d5db; }
    .user-text h1 { font-size: 18px; font-weight: 600; margin-top: 2px;}

    .header-icons { display: flex; gap: 12px; font-size: 18px; }
    .header-icons i {
      width: 38px; height: 38px;
      background: rgba(0, 0, 0, 0.25); 
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .header-icons i:active { background: rgba(0, 0, 0, 0.4); }

    .online-badge {
      background: #22c55e; color: white; font-size: 9px; font-weight: bold;
      padding: 2px 6px; border-radius: 4px; margin-left: 4px;
      display: inline-flex; align-items: center; gap: 3px; vertical-align: middle;
    }
    .online-dot { width: 4px; height: 4px; background: white; border-radius: 50%; }

    /* 🌟 พื้นที่สกอลล์ */
    .main-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    
    .main-scroll-area::-webkit-scrollbar { display: none; }

    /* พื้นที่ส่วนกลาง (สีน้ำเงิน) */
    .blue-section {
      padding: 0 16px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    /* --- บัตรประชาชน --- */
    .card-wrapper {
      width: 100%; height: 220px; perspective: 1000px; position: relative;
    }

    .card-inner {
      width: 100%; height: 100%; transition: transform 0.6s;
      transform-style: preserve-3d; position: relative; cursor: pointer;
    }

    .card-inner.is-flipped { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); overflow: hidden; background: #fff;
    }

    .card-back { transform: rotateY(180deg); }

    .card-image { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 🌟 หน้า Lock */
    .lock-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-radius: 12px; 
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10;
    }

    .lock-icon-svg { width: 56px; height: 56px; fill: #333; margin-bottom: 12px; }
    .lock-text { font-size: 18px; font-weight: 600; color: #333; }

    /* ปุ่มเมนูใต้บัตร */
    .card-action-bar { margin-top: 15px; display: flex; justify-content: center; gap: 12px; width: 100%; }
    
    .card-action-btn {
      background: #2b359c; color: white; border: none;
      padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.2s; font-family: inherit;
    }
    .card-action-btn:active { transform: scale(0.95); }
    
    .card-action-btn.icon-only { 
      padding: 0; width: 40px; height: 40px; border-radius: 50%; 
      display: flex; justify-content: center; align-items: center;
    }

    /* 🌟 พื้นที่สีขาวด้านล่าง */
    .white-section {
      flex: 1; 
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      margin-top: 20px;
      padding-top: 24px;
      position: relative;
      z-index: 20;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 20px 16px 20px; }
    .section-title h2 { font-size: 18px; color: #333; font-weight: 600; }
    .section-title a { font-size: 13px; color: #888; text-decoration: none; }

    /* 🌟 เมนูบริการ */
    .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 20px; }
    .menu-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; cursor: pointer; }
    
    .menu-icon { 
      width: 56px; height: 56px; 
      background: #eceef2; 
      border-radius: 50%; 
      display: flex; justify-content: center; align-items: center; 
    }

    .menu-icon svg {
      width: 30px; height: 30px;
      stroke: #1a1c8f; stroke-width: 1.8; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    
    .menu-item span { font-size: 12px; color: #6b7280; line-height: 1.2; }

    /* สไลเดอร์ */
    .carousel-wrapper {
      overflow-x: auto;
      scrollbar-width: none; 
      margin-top: 24px;
      padding: 0; 
      position: relative;
    }
    .carousel-wrapper::-webkit-scrollbar { display: none; }

    .carousel-track {
      display: flex;
      gap: 12px;
      width: max-content;
      padding: 0 10%; 
    }

    .banner {
      flex: 0 0 auto; border-radius: 12px; overflow: hidden;
      position: relative; height: 90px; background: #e5e7eb; cursor: pointer;
    }

    .banner-bg-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }

    .banner-placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      color: #9ca3af; font-size: 24px; z-index: 0;
    }

    /* จุดบอกตำแหน่ง */
    .carousel-dots {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      margin-top: 12px; margin-bottom: 24px; 
    }

    .dot-indicator {
      width: 8px; height: 8px; border-radius: 50%; background-color: #d1d5db;
      transition: all 0.3s ease;
    }

    .dot-indicator.active {
      width: 24px; border-radius: 4px; background-color: #1a1c8f;
    }

    /* 🌟 ประกาศทั้งหมด */
    .announcement-vertical-list {
      display: flex; flex-direction: column; gap: 12px;
      padding: 0 20px; margin-bottom: 20px;
    }

    .announcement-vertical-box {
      width: 100%; height: 80px; border-radius: 12px;
      background: #f1f5f9; overflow: hidden; position: relative;
      cursor: pointer; border: 1px solid #e2e8f0;
    }

    .announcement-vertical-box .banner-bg-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }

    .announcement-vertical-box .banner-placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      color: #9ca3af; font-size: 24px; z-index: 0;
    }

    /* 🌟 แถบเมนูล่าง */
    .bottom-nav {
      position: absolute; 
      left: 0; right: 0; bottom: 0;
      width: auto;
      background: white;
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0 max(20px, env(safe-area-inset-bottom)) 0;
      border-top: 1px solid #eee;
      z-index: 30;
    }

    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9ca3af; font-size: 11px; background: none; border: none; cursor: pointer; font-family: inherit;}
    .nav-item.active { color: #1a1c8f; font-weight: 600;}
    .nav-item i { font-size: 22px; }
    
    .nav-scan { margin-top: -35px; }
    .scan-btn { width: 64px; height: 64px; background: #1a1c8f; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 26px; border: 5px solid #f8f9fa; box-shadow: 0 4px 12px rgba(26, 28, 143, 0.3); }

    .scan-icon {
      width: 32px; height: 32px;
      stroke: #ffffff; stroke-width: 1.8; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* 🌟 ปุ่มแชท */
    .chat-fab {
      position: absolute;
      right: 16px;
      bottom: calc(100% + 12px);
      top: auto;
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 40;
    }
    .chat-fab svg {
      width: 28px; height: 28px;
      stroke: #1a1c8f; stroke-width: 2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* --- PIN Modal --- */
    .pin-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 100; display: flex; flex-direction: column; justify-content: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; 
    }
    .pin-modal.show { opacity: 1; pointer-events: all; }
    .pin-container { 
      background: #f8f9fa; border-radius: 30px 30px 0 0; padding: 24px 20px 40px 20px; 
      display: flex; flex-direction: column; align-items: center; 
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      width: 100%; 
    }
    .pin-modal.show .pin-container { transform: translateY(0); }
    .pin-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 20px; }
    .pin-dots { display: flex; gap: 12px; margin-bottom: 30px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #e5e7eb; border: 1px solid #d1d5db; transition: background 0.2s; }
    .dot.filled { background: #6b7280; border-color: #6b7280; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 300px; }
    .key { width: 70px; height: 70px; border-radius: 50%; background: #eef1f5; color: #1a1c8f; font-size: 24px; font-weight: 500; display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; margin: 0 auto; border: none; font-family: inherit; }
    .key:active { background: #d1d5db; }
    .key.action { background: transparent; font-size: 20px; color: #1a1c8f; }
    .forgot-btn { margin-top: 20px; font-size: 14px; color: #555; background: #e5e7eb; padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; font-family: inherit;}

    /* 🌟 Modal ขยายรูปบัตร (หรี่แสงทั้งจอ) */
    .expand-modal {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 200;
      display: none;
      flex-direction: column;
      overflow: hidden;
      container-type: size;
    }
    
    .expand-header {
      padding: calc(env(safe-area-inset-top) + 8px) 20px 20px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #ffffff; position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
    }
    
    .back-btn,
    .header-icons-expanded .icon-btn {
      background: rgba(190, 185, 225, 0.55);
      border: none;
      color: #ffffff;
      width: 46px; height: 46px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; cursor: pointer;
      box-shadow: none;
    }

    .header-icons-expanded { display: flex; gap: 12px; }

    .expand-card-container {
      position: absolute; top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%) rotate(90deg);
      display: flex; justify-content: center; align-items: center;
    }

    .expand-card-inner {
      flex-shrink: 0; 
      width: min(calc(96cqh), calc((96cqw) * 1.58));
      aspect-ratio: 1.58 / 1;
      position: relative; transition: transform 0.6s; transform-style: preserve-3d;
      cursor: pointer; perspective: 1000px;
    }

    .expand-card-inner.is-flipped { transform: rotateY(180deg); }

    .expand-card-front, .expand-card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 12px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
      overflow: hidden; background: white;
    }

    .expand-card-back { transform: rotateY(180deg); }

    .expand-card-image {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    /* ปุ่ม Reset รูปภาพ */
    .reset-btn {
      position: absolute; bottom: 15px; right: 15px;
      width: 24px; height: 24px;
      background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%; cursor: pointer; z-index: 999; opacity: 0.6; 
      transition: all 0.2s; display: flex; justify-content: center; align-items: center;
      color: white; font-size: 10px;
    }
    .reset-btn:hover, .reset-btn:active { 
      opacity: 1; background: rgba(255, 0, 0, 0.8); border-color: red; 
    }

    .solid-box-icon {
      stroke: none !important; 
    }
  </style>
</head>
<body>

  <input type="file" id="uploadBanner1" accept="image/*" onchange="handleImageUpload(event, 'banner1')">
  <input type="file" id="uploadBanner2" accept="image/*" onchange="handleImageUpload(event, 'banner2')">
  
  <input type="file" id="uploadAnn1" accept="image/*" onchange="handleImageUpload(event, 'ann1')">
  <input type="file" id="uploadAnn2" accept="image/*" onchange="handleImageUpload(event, 'ann2')">
  <input type="file" id="uploadAnn3" accept="image/*" onchange="handleImageUpload(event, 'ann3')">
  <input type="file" id="uploadAnn4" accept="image/*" onchange="handleImageUpload(event, 'ann4')">
  <input type="file" id="uploadAnn5" accept="image/*" onchange="handleImageUpload(event, 'ann5')">

  <input type="file" id="uploadAvatar" accept="image/*" onchange="handleImageUpload(event, 'avatar')">
  <input type="file" id="uploadIdFront" accept="image/*" onchange="handleImageUpload(event, 'front')">
  <input type="file" id="uploadIdBack" accept="image/*" onchange="handleImageUpload(event, 'back')">

  <div class="app-container">
    
    <button class="reset-btn" onclick="resetImages()" title="ล้างรูปภาพทั้งหมด"><i class="fa-solid fa-trash-can"></i></button>

    <header>
      <div class="header-top">
        <div class="user-info">
          <div class="avatar-container" onclick="document.getElementById('uploadAvatar').click()">
            <div class="avatar" id="avatarImg"></div>
          </div>
          <div class="user-text">
            <p>สวัสดี <span class="online-badge"><span class="online-dot"></span>ONLINE</span></p>
            <h1>คุณ ประภูกฤต บุตร์โส</h1>
          </div>
        </div>
        
        <div class="header-icons">
          <i class="fa-regular fa-bell"></i>
          <i class="fa-solid fa-power-off"></i>
        </div>
      </div>
    </header>

    <div class="main-scroll-area">
      <div class="blue-section">
        <div class="card-wrapper" id="cardWrapper">
          <div class="card-inner" id="myIdCard" onclick="handleCardClick(event)">
            
            <div class="card-front">
              <img src="" alt="Front ID" class="card-image" id="idFrontImg" style="background: #e2e8f0; display: none;">
              
              <div id="frontUploadPrompt" style="position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background: #f1f5f9; color:#64748b;">
                <i class="fa-solid fa-image" style="font-size: 30px; margin-bottom: 10px;"></i>
                <p style="font-size: 14px;">คลิกเพื่ออัปโหลดรูปบัตรด้านหน้า</p>
              </div>

              <div class="lock-overlay" id="lockScreen" onclick="showPinModal(event)">
                <svg class="lock-icon-svg" viewBox="0 0 24 24">
                  <path d="M17 8V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-1zM9 6a3 3 0 0 1 6 0v2H9V6zm3 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" />
                </svg>
                <p class="lock-text">คลิกเพื่อแสดงบัตร</p>
              </div>
            </div>

            <div class="card-back">
              <img src="" alt="Back ID" class="card-image" id="idBackImg" style="background: #e2e8f0; display: none;">
              
              <div id="backUploadPrompt" style="position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background: #f1f5f9; color:#64748b;">
                <i class="fa-solid fa-image" style="font-size: 30px; margin-bottom: 10px;"></i>
                <p style="font-size: 14px;">คลิกเพื่ออัปโหลดรูปบัตรด้านหลัง</p>
              </div>
            </div>

          </div>
        </div>

        <div class="card-action-bar" id="cardMenu">
          <button class="card-action-btn icon-only" id="btnInfo" onclick="handleActionClick('info', event)">
            <i class="fa-regular fa-id-badge"></i>
          </button>
          <button class="card-action-btn" id="btnExpand" onclick="handleActionClick('expand', event)">
            <i class="fa-solid fa-up-right-and-down-left-from-center"></i> ขยายรูปบัตร
          </button>
          <button class="card-action-btn icon-only" id="btnFlip" onclick="handleActionClick('flip', event)">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>

      <div class="white-section">
        <div class="section-title">
          <h2>เมนูบริการ</h2>
          <a href="#">ทั้งหมด <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i></a>
        </div>
        
        <div class="menu-grid">
          
          <div class="menu-item" onclick="alert('ระบบตรวจสอบคำขอ')">
            <div class="menu-icon">
              <svg viewBox="0 0 24 24" class="search-request-icon">
                <rect x="2.5" y="2.5" width="19" height="19" rx="3.5" ry="3.5"></rect>
                <circle cx="11" cy="11" r="5.5"></circle>
                <line x1="15" y1="15" x2="19" y2="19"></line>
                <circle cx="11" cy="9.3" r="1.7"></circle>
                <path d="M7.9 14 a3.1 3.1 0 0 1 6.2 0"></path>
              </svg>
            </div>
            <span>ตรวจสอบ<br>คำขอ</span>
          </div>

          <div class="menu-item" onclick="alert('ระบบการรับรองเอกสาร')">
            <div class="menu-icon">
              <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <polyline points="9 15 11 17 15 13"></polyline>
              </svg>
            </div>
            <span>การรับรอง<br>เอกสาร</span>
          </div>

          <div class="menu-item" onclick="alert('ระบบแจ้งย้ายที่อยู่')">
            <div class="menu-icon">
              <svg viewBox="0 0 24 24" class="solid-box-icon">
